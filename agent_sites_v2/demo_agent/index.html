<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ agent_name }} - Real Estate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <header class="bg-primary text-white text-center py-4">
    <img src="{{ logo_url }}" alt="Logo" style="max-height: 60px;" />
    <h1>{{ agent_name }}</h1>
    <p>{{ tagline }}</p>
  </header>

  <section class="container my-4">
    <h2>About Me</h2>
    <p>{{ about }}</p>
  </section>

  <section class="container my-4">
    <h2>My Listings</h2>
    <div class="row">
      {% for post in posts %}
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="{{ post.image_url }}" class="card-img-top" alt="Listing image" />
          <div class="card-body">
            <p class="card-text">{{ post.caption }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </section>

  <footer class="text-center py-3">
    <small>Powered by Agentic AI Properties</small>
  </footer>

</body>
</html>
